            q.push({ q: "21. A: ____ does the soup taste? B: It tastes a little salty.", options: ["How", "What", "Why", "When"], ans: 0, exp: "詢問「如何」用 How does... taste?" });
            q.push({ q: "22. A: ____ does the cloud look like? B: It looks like a rabbit.", options: ["How", "What", "Which", "Who"], ans: 1, exp: "詢問「像什麼」用 What does... look like?" });
            q.push({ q: "23. The milk tea ____ great. Can I have another cup?", options: ["is tasting", "tasted like", "tastes", "tastes to be"], ans: 2, exp: "連綴動詞通常不用進行式，且直接接形容詞。" });
            q.push({ q: "24. After a long walk, the kids ____ tired and hungry.", options: ["got", "sounded", "tasted", "smelled"], ans: 0, exp: "get/got + adj 表示「變得」。" });

            q.push({ q: "29. My dad ____ angry when he saw my math test score.", options: ["became", "looked like", "felt like", "sounded like"], ans: 0, exp: "become + adj (變得)。" });
            q.push({ q: "30. Does this jacket ____ good on me?", options: ["look", "see", "watch", "make"], ans: 0, exp: "look good on sb (某人穿起來好看)。" });
            q.push({ q: "31. The fish ____ bad. Don't eat it.", options: ["smells", "smells like", "is smelling", "is smelled"], ans: 0, exp: "smell bad (聞起來壞掉了)。不用進行式。" });
            q.push({ q: "32. The actress is getting ____ beautiful.", options: ["more and more", "much and much", "most and most", "beautifuler and beautifuler"], ans: 0, exp: "多音節形容詞的越來越...：more and more + adj。" });
            q.push({ q: "33. Who ____ she look like? Her mom or her dad?", options: ["is", "does", "do", "has"], ans: 1, exp: "look 在此為一般動詞，需助動詞 does。" });
            q.push({ q: "34. The cake ____ sweet. I like it very much.", options: ["tastes", "tastes like", "is tasted", "tasting"], ans: 0, exp: "連綴動詞 taste + adj。" });
            q.push({ q: "35. It ____ like it's going to rain. Look at those dark clouds.", options: ["looks", "sees", "watches", "gets"], ans: 0, exp: "It looks like + 子句 (看起來像...)" });
            q.push({ q: "36. I don't feel ____ eating anything right now.", options: ["like", "as", "to", "X"], ans: 0, exp: "feel like + V-ing (想要...)" });
            q.push({ q: "37. He looks ____ a friendly person.", options: ["X", "like", "as", "to be"], ans: 1, exp: "look like + 名詞片語。" });

            // 41-60 Causative Verbs & Idioms
            q.push({ q: "41. My mom made me ____ my room before I could go out.", options: ["clean", "to clean", "cleaned", "cleaning"], ans: 0, exp: "make + O + VR (原形動詞)。" });

            q.push({ q: "52. Hurry up, ____ you will be late for the movie.", options: ["or", "and", "so", "but"], ans: 0, exp: "祈使句 + or + 句子 (否則...)。" });

            // 61-80 Reading, Translation & Mixed Grammar (High Difficulty)
            q.push({ q: "61. Many fast food restaurants use red in their signs because red ____.", options: ["invites people in", "makes people sleepy", "stands for nature", "looks like tomatoes"], ans: 0, exp: "課文提到 red invites people into the stores." });

            q.push({ q: "63. 'Some... Other... Still other...' is used to talk about ____ groups.", options: ["three", "two", "four", "one"], ans: 0, exp: "這三個字詞用來分列「三種」不同的群體。" });
            q.push({ q: "64. 'Because of' must be followed by a ____.", options: ["noun/V-ing", "complete sentence", "verb", "adjective"], ans: 0, exp: "because of 是介系詞，後接名詞或動名詞。" });
            q.push({ q: "65. Yellow and red make people feel hungry, ____ they probably go in for a bite.", options: ["so", "because", "but", "or"], ans: 0, exp: "前面是原因，後面是結果，用 so 連接。" });
            q.push({ q: "66. When Gordon ____ you tomorrow, he will be very happy.", options: ["sees", "will see", "saw", "is seeing"], ans: 0, exp: "在 when 引導的未來時間副詞子句中，用現在式代替未來式。" });
            q.push({ q: "67. We use ____ oil, salt, and sugar to make our food healthier.", options: ["less", "fewer", "little", "few"], ans: 0, exp: "oil, salt, sugar 為不可數，比較級用 less。" });
            q.push({ q: "68. Which sentence is grammatically INCORRECT?", options: ["He had me to clean the room.", "He made me clean the room.", "He let me clean the room.", "He helped me clean the room."], ans: 0, exp: "have 為使役動詞，後接原形，不可加 to。" });
            q.push({ q: "69. ____ English, I am also good at math.", options: ["Besides", "Beside", "Except", "Behind"], ans: 0, exp: "Besides (除了...之外還有)。" });

            q.push({ q: "71. 'What about that one?' In this sentence, 'one' refers to ____.", options: ["a restaurant", "a person", "a meal", "a sign"], ans: 0, exp: "對話中，one 代替前面提到的 restaurant。" });
            q.push({ q: "72. I don't want to go out ____ the heavy rain.", options: ["because of", "because", "so", "but"], ans: 0, exp: "the heavy rain 是名詞片語，需用 because of。" });

        // Quiz Interface
        const QuizInterface = () => {
            const [qIndex, setQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [showExp, setShowExp] = useState(false);
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [isFinished, setIsFinished] = useState(false);
            const [wrongAnswers, setWrongAnswers] = useState([]);

            const currentQ = quizQuestions[qIndex];

            const handleAnswer = (optIndex) => {
                if (showExp) return; // Prevent multiple clicks
                setSelectedOpt(optIndex);
                setShowExp(true);
                
                if (optIndex === currentQ.ans) {
                    setScore(score + 1);
                } else {
                    setWrongAnswers([...wrongAnswers, { ...currentQ, userAns: currentQ.options[optIndex] }]);
                }
            };

            const nextQuestion = () => {
                if (qIndex < quizQuestions.length - 1) {
                    setQIndex(qIndex + 1);
                    setShowExp(false);
                    setSelectedOpt(null);
                } else {
                    setIsFinished(true);
                }
            };

            const restartQuiz = () => {
                setQIndex(0);
                setScore(0);
                setShowExp(false);
                setSelectedOpt(null);
                setIsFinished(false);
                setWrongAnswers([]);
            };

            if (isFinished) {
                const passRate = Math.round((score / quizQuestions.length) * 100);
                return (
                    <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-xl p-8 text-center fade-in">
                        <h2 className="text-4xl font-extrabold text-gray-800 mb-4">測驗結束！</h2>
                        <div className="w-48 h-48 mx-auto rounded-full border-8 border-gray-100 flex items-center justify-center relative mb-6">
                            <svg className="absolute top-0 left-0 w-full h-full transform -rotate-90">
                                <circle cx="96" cy="96" r="88" stroke="currentColor" strokeWidth="16" fill="transparent" className="text-gray-200" />
                                <circle cx="96" cy="96" r="88" stroke="currentColor" strokeWidth="16" fill="transparent" 
                                    strokeDasharray={`${passRate * 5.5} 600`} 
                                    className={passRate >= 80 ? "text-green-500" : passRate >= 60 ? "text-yellow-500" : "text-red-500"} />
                            </svg>
                            <div className="text-center">
                                <span className="text-5xl font-bold">{score}</span>
                                <span className="text-xl text-gray-500"> / {quizQuestions.length}</span>
                            </div>
                        </div>
                        <p className="text-2xl font-bold mb-8 text-gray-700">
                            {passRate >= 80 ? "太棒了！你已經完全掌握 L3！ 🎉" : passRate >= 60 ? "表現不錯，但還有進步空間！ 💪" : "需要再多複習一下喔！ 📚"}
                        </p>
                        
                        <button onClick={restartQuiz} className="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:-translate-y-1 mb-10">
                            <i className="fa-solid fa-rotate-right mr-2"></i> 再挑戰一次
                        </button>

                        {wrongAnswers.length > 0 && (
                            <div className="text-left mt-8">
                                <h3 className="text-2xl font-bold text-red-600 border-b-2 border-red-200 pb-2 mb-4"><i className="fa-solid fa-triangle-exclamation mr-2"></i>錯題回顧</h3>
                                <div className="space-y-4">
                                    {wrongAnswers.map((wq, idx) => (
                                        <div key={idx} className="bg-red-50 p-4 rounded-lg border border-red-100">
                                            <p className="font-bold text-gray-800 mb-2">{wq.q}</p>
                                            <p className="text-red-500"><i className="fa-solid fa-xmark mr-1"></i>你的答案: {wq.userAns}</p>
                                            <p className="text-green-600"><i className="fa-solid fa-check mr-1"></i>正確答案: {wq.options[wq.ans]}</p>
                                            <p className="text-gray-600 mt-2 text-sm bg-white p-2 rounded"><i className="fa-solid fa-lightbulb text-yellow-500 mr-1"></i>解析: {wq.exp}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto fade-in">
                    <div className="flex justify-between items-center mb-4">
                        <span className="bg-yellow-400 text-yellow-900 font-bold px-3 py-1 rounded-full text-sm">Question {qIndex + 1} / {quizQuestions.length}</span>
                        <span className="font-bold text-gray-600">Score: <span className="text-red-500">{score}</span></span>
                    </div>
                    
                    {/* Progress Bar */}
                    <div className="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                        <div className="bg-red-500 h-2.5 rounded-full transition-all duration-300" style={{ width: `${((qIndex) / quizQuestions.length) * 100}%` }}></div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-lg p-6 md:p-10">
                        <h2 className="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">{currentQ.q}</h2>
                        
                        <div className="space-y-3 mb-8">
                            {currentQ.options.map((opt, idx) => {
                                let btnClass = "w-full text-left p-4 rounded-xl border-2 transition font-medium text-lg focus:outline-none ";
                                if (!showExp) {
                                    btnClass += "border-gray-200 hover:border-red-400 hover:bg-red-50 text-gray-700";
                                } else {
                                    if (idx === currentQ.ans) {
                                        btnClass += "border-green-500 bg-green-50 text-green-800"; // Correct answer
                                    } else if (idx === selectedOpt) {
                                        btnClass += "border-red-500 bg-red-50 text-red-800"; // Wrong selected
                                    } else {
                                        btnClass += "border-gray-200 text-gray-400 opacity-50"; // Unselected
                                    }
                                }

                                return (
                                    <button 
                                        key={idx} 
                                        onClick={() => handleAnswer(idx)}
                                        className={btnClass}
                                        disabled={showExp}
                                    >
                                        <span className="inline-block w-8 font-bold text-gray-400">{String.fromCharCode(65 + idx)}.</span>
                                        {opt}
                                        {showExp && idx === currentQ.ans && <i className="fa-solid fa-circle-check text-green-500 float-right mt-1 text-xl"></i>}
                                        {showExp && idx === selectedOpt && idx !== currentQ.ans && <i className="fa-solid fa-circle-xmark text-red-500 float-right mt-1 text-xl"></i>}
                                    </button>
                                );
                            })}
                        </div>

                        {showExp && (
                            <div className="fade-in bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-6">
                                <p className="text-yellow-800 font-bold mb-1"><i className="fa-solid fa-lightbulb mr-2"></i>解析</p>
                                <p className="text-gray-700">{currentQ.exp}</p>
                            </div>
                        )}

                        <div className="flex justify-end">
                            <button 
                                onClick={nextQuestion}
                                disabled={!showExp}
                                className={`font-bold py-3 px-8 rounded-full transition shadow ${showExp ? 'bg-red-500 hover:bg-red-600 text-white cursor-pointer' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                                {qIndex === quizQuestions.length - 1 ? '看成績' : '下一題'} <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('learning');

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />
                    
                    <main className="flex-grow max-w-6xl w-full mx-auto p-4 md:p-8">
                        {activeTab === 'learning' ? <LearningInterface /> : <QuizInterface />}
                    </main>

                    <footer className="bg-gray-800 text-gray-400 py-6 text-center">
                        <p>© 2026 Interactive English Learning - L3 Our Food Smells Good</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
