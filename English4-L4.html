            const [name, setName] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [recentUsers, setRecentUsers] = useState([]);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                if (!isFirebaseReady) return;
                
                const { doc, onSnapshot } = window.firebaseModules;
                // 使用公開路徑取得全域登入名單
                const globalDocRef = doc(db, 'artifacts', getAppId(), 'public', 'data', COLLECTION_NAME, DOC_GLOBAL);

                // 使用 onSnapshot 即時監聽，資料一有變動立刻更新畫面
                const unsubscribe = onSnapshot(globalDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.users && Array.isArray(data.users)) {
                            const names = data.users.map(u => typeof u === 'string' ? u : u.name).filter(Boolean);
                            const uniqueNames = [...new Set(names)].reverse();
                            setRecentUsers(uniqueNames);
                        }
                    }
                }, (error) => {
                    console.error("無法取得近期登入名單:", error);
                });

                return () => unsubscribe();
            }, [isFirebaseReady]);

            const handleLoginClick = async (loginName) => {
                setErrorMsg('');
                if (!isFirebaseReady) return setErrorMsg('系統連線中，請稍候...');
                if (!loginName.trim()) return setErrorMsg('請輸入您的姓名');
                
                setIsLoading(true);
                try {
                    await onLogin(loginName);
                } catch(err) {
                    setErrorMsg("登入失敗，請檢查網路連線後重試");
                }
                setIsLoading(false);
            };

            return (

                        </div>
                        <h2 className="text-4xl font-black text-gray-800 mb-4 tracking-tight">L4 學習總部</h2>
                        <p className="text-gray-500 mb-10 font-bold">登入以自動儲存您的學習進度與測驗紀錄</p>
                        
                        {errorMsg && (
                            <div className="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-8 rounded text-left text-sm font-bold shadow-sm">
                                <i className="fa-solid fa-circle-exclamation mr-2"></i>{errorMsg}
                            </div>
                        )}
                        
                        <input 
                            type="text" 
                            placeholder="請輸入姓名 / Enter your name" 
                            className="w-full px-6 py-5 rounded-2xl border-2 border-gray-200 focus:border-orange-400 focus:ring-4 focus:ring-orange-100 focus:outline-none mb-8 text-xl font-bold text-center transition shadow-inner bg-gray-50 focus:bg-white"
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleLoginClick(name)}
                        />
                        
                        <div className="space-y-5">
                            <button 
                                onClick={() => handleLoginClick(name)}
                                disabled={isLoading || !isFirebaseReady || !name.trim()}
                                className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-5 px-4 rounded-2xl shadow-xl transition-all text-xl disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-orange-500/30">
                                {isLoading ? <i className="fa-solid fa-circle-notch fa-spin text-2xl"></i> : '進入學習系統 Login'}
                            </button>
                            
                            <div className="relative flex items-center py-4">
                                <div className="flex-grow border-t-2 border-gray-100"></div>
                                <span className="flex-shrink-0 mx-5 text-gray-400 text-sm font-black tracking-widest">快速登入 RECENT</span>
                                <div className="flex-grow border-t-2 border-gray-100"></div>
                            </div>
                            
                            <div className="bg-gray-50 p-5 rounded-2xl border border-gray-100 max-h-56 overflow-y-auto shadow-inner">
                                {recentUsers.length > 0 ? (
                                    <div className="flex flex-wrap gap-3 justify-center">
                                        {recentUsers.map((uName, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleLoginClick(uName)}
                                                disabled={isLoading || !isFirebaseReady}
                                                className="bg-white border-2 border-gray-200 hover:border-orange-400 hover:text-orange-600 text-gray-700 px-5 py-2.5 rounded-full font-bold shadow-sm transition-all text-sm disabled:opacity-50 hover:shadow-md"
                                            >
                                                <i className="fa-solid fa-user mr-2 text-gray-400"></i>{uName}
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-sm text-gray-400 font-bold py-4">尚無近期登入紀錄</p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('login'); // 'login', 'learning', 'quiz'
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initFirebase = async () => {
                    // 等待模組掛載到全域變數後再初始化
                    if (!window.firebaseModules) {
                        setTimeout(initFirebase, 100);
                        return;
                    }
                    try {
                        const { initializeApp, getFirestore, doc, setDoc, getDoc, arrayUnion, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } = window.firebaseModules;

                        // 初始化 Firebase (結合環境變數支援)
                        const app = initializeApp(typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig);
                        db = getFirestore(app);
                        auth = getAuth(app);
                        
                        // 掛載常用功能供其他元件使用
                        window.fbHelpers = { doc, setDoc, getDoc, arrayUnion }; 

                        // 先進行 Firebase 身分驗證 (系統強制規範)
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        setIsFirebaseReady(true);

                        // 登入狀態監聽
                        unsubscribeAuth = onAuthStateChanged(auth, async (user) => {
                            if (user) {
                                try {
                                    const docSnap = await getDoc(doc(db, 'artifacts', getAppId(), 'users', user.uid, COLLECTION_NAME, 'profile'));
                                    if (docSnap.exists()) {
                                        setCurrentUser({ uid: user.uid, name: docSnap.data().name });
                                        setActiveTab('learning'); // 已經有紀錄的用戶直接進入學習介面
                                    }
                                } catch (err) {
                                    console.error("讀取使用者資料錯誤:", err);
                                }
                            }
                        });
                    } catch (e) {
                        console.error("Firebase 初始化失敗:", e);
                    }
                };
                initFirebase();
                return () => { if (unsubscribeAuth) unsubscribeAuth(); };
            }, []);

            const handleLogin = async (loginName) => {
                try {
                    const { doc, setDoc, arrayUnion } = window.fbHelpers;
                    const user = auth.currentUser;
                    if (!user) throw new Error("尚未完成身份驗證");

                    const userData = {
                        uid: user.uid,
                        name: loginName,
                        lastLogin: new Date().toISOString()
                    };

                    // 1. 儲存至使用者專屬文件 (Private)
                    await setDoc(doc(db, 'artifacts', getAppId(), 'users', user.uid, COLLECTION_NAME, 'profile'), userData, { merge: true });
                    
                    // 2. 更新至 Global_Users 清單 (Public)
                    await setDoc(doc(db, 'artifacts', getAppId(), 'public', 'data', COLLECTION_NAME, DOC_GLOBAL), {
                        users: arrayUnion({ uid: user.uid, name: loginName, time: new Date().toISOString() })
                    }, { merge: true });

                    setCurrentUser(userData);
                    setActiveTab('learning');
                } catch (e) {
                    console.error("登入邏輯失敗:", e);
                    throw e; // 拋出錯誤供 LoginView 捕捉
                }
            };

            const handleLogout = async () => {
                try {
                    if (window.firebaseModules && window.firebaseModules.signOut) {
                        await window.firebaseModules.signOut(auth);
                    }
                    setCurrentUser(null);
                    setActiveTab('login');
                } catch (e) {
                    console.error("登出失敗:", e);
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative pb-16 font-sans">
                    {activeTab !== 'login' && <Navbar activeTab={activeTab} setActiveTab={setActiveTab} currentUser={currentUser} onLogout={handleLogout} />}
                    
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-8 relative z-10">
                        {activeTab === 'login' && <LoginView onLogin={handleLogin} isFirebaseReady={isFirebaseReady} />}
                        {activeTab === 'learning' && <LearningInterface />}
                        {activeTab === 'quiz' && <QuizInterface currentUser={currentUser} isFirebaseReady={isFirebaseReady} />}
                    </main>

                    {/* 常駐的右下角連線狀態 */}
                    <StatusBar isFirebaseReady={isFirebaseReady} currentUser={currentUser} />

                    <footer className="bg-orange-900 text-orange-100/50 py-8 text-center mt-auto relative z-10 font-bold">
                        <p>© 2026 Interactive English Learning - L4 Let's Set Up Camp Quickly</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
