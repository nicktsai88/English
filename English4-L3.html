            return rawQ.map((item, idx) => {
                const ansIndex = idx % 4; // 確保正解完美平均分佈在 0(A), 1(B), 2(C), 3(D) 四個位置

                        wrongIdx++;
                    }
                }
                
                return {

                    options: options,
                    ans: ansIndex,
                    exp: item.exp
                };

                    <div key={idx} className="bg-white p-5 rounded-xl shadow hover:shadow-lg transition border-l-4 border-yellow-400 relative group cursor-pointer">
                        <div className="flex justify-between items-start">
                            <h3 className="text-xl font-bold text-gray-800">{item.word}</h3>
                            <span className="text-sm font-semibold text-white bg-red-400 px-2 py-1 rounded">{item.pos}</span>
                        </div>
                        <p className="text-gray-500 text-sm mb-2">{item.phonetic}</p>
                        <p className="text-lg font-bold text-green-700 mb-3">{item.meaning}</p>
                        <div className="text-sm text-gray-700 bg-gray-50 p-2 rounded hidden group-hover:block absolute z-10 w-full left-0 top-full mt-1 shadow-xl border border-gray-200">
                            <p className="mb-1"><i className="fa-solid fa-comment-dots text-yellow-500 mr-1"></i> <strong>例句:</strong> {item.example}</p>
                            <p><i className="fa-solid fa-lightbulb text-yellow-500 mr-1"></i> <strong>解析:</strong> {item.note}</p>
                        </div>
                        <p className="text-xs text-gray-400 group-hover:hidden"><i className="fa-solid fa-hand-pointer mr-1"></i>滑鼠移入看解析</p>
                    </div>
                ))}
            </div>
        );

        const PhrasesView = () => (
            <div className="space-y-4 fade-in">
                {phrasesList.map((item, idx) => (
                    <div key={idx} className="bg-white p-5 rounded-xl shadow flex flex-col md:flex-row md:items-center justify-between border-l-4 border-blue-400">
                        <div className="md:w-1/3">
                            <h3 className="text-xl font-bold text-gray-800">{item.phrase}</h3>
                            <p className="text-lg font-bold text-blue-600">{item.meaning}</p>
                        </div>
                        <div className="md:w-2/3 mt-2 md:mt-0 bg-blue-50 p-3 rounded">
                            <p className="text-gray-700"><strong>例句:</strong> {item.example}</p>
                        </div>
                    </div>
                ))}
            </div>
        );

        const GrammarView = () => (
            <div className="space-y-8 fade-in">
                {grammarData.map((grammar, idx) => (
                    <div key={idx} className="bg-white rounded-xl shadow-md overflow-hidden">
                        <div className="bg-red-500 text-white p-4">
                            <h2 className="text-2xl font-bold">{grammar.title}</h2>
                            <p className="text-red-100 mt-1">{grammar.description}</p>
                        </div>
                        <div className="p-6 space-y-6">
                            {grammar.sections.map((sec, sIdx) => (
                                <div key={sIdx} className="border-l-4 border-yellow-400 pl-4">
                                    <h3 className="text-xl font-bold text-gray-800 mb-2">{sec.subtitle}</h3>
                                    {sec.rules.length > 0 && (
                                        <ul className="list-disc list-inside text-gray-700 mb-3 space-y-1">
                                            {sec.rules.map((rule, rIdx) => <li key={rIdx}>{rule}</li>)}
                                        </ul>
                                    )}
                                    <div className="bg-gray-50 p-4 rounded-lg space-y-2 font-mono text-sm text-indigo-800">
                                        {sec.formulas.map((form, fIdx) => <p key={fIdx}>✅ {form}</p>)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
            </div>
        );

        const ReadingView = () => {
            const [showZh, setShowZh] = useState(true);
            return (
                <div className="fade-in space-y-6">
                    <div className="flex justify-end mb-4">
                        <button 
                            onClick={() => setShowZh(!showZh)}
                            className="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-4 rounded shadow transition">
                            <i className="fa-solid fa-language mr-2"></i>
                            {showZh ? '隱藏中文翻譯' : '顯示中文翻譯'}
                        </button>
                    </div>
                    {textAnalysisData.map((text, idx) => (
                        <div key={idx} className="bg-white rounded-xl shadow overflow-hidden">
                            <div className="bg-green-600 text-white p-3 px-5 flex justify-between items-center">
                                <span className="font-bold bg-green-800 px-2 py-1 rounded text-xs">{text.type}</span>
                                <h3 className="text-lg font-bold">{text.title}</h3>
                            </div>
                            <div className="p-5">
                                <div className="space-y-4 mb-6">
                                    {text.content.map((line, lIdx) => (
                                        <div key={lIdx} className={`p-3 rounded ${lIdx % 2 === 0 ? 'bg-gray-50' : 'bg-white'}`}>
                                            <p className="text-gray-800 font-medium text-lg">{line.en}</p>
                                            {showZh && <p className="text-green-700 mt-1">{line.zh}</p>}
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-lg">
                                    <h4 className="font-bold text-yellow-800 mb-2"><i className="fa-solid fa-star mr-1"></i>重點句型與解析</h4>
                                    <ul className="list-disc list-inside text-gray-700 space-y-1">
                                        {text.notes.map((note, nIdx) => <li key={nIdx}>{note}</li>)}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const LearningInterface = () => {
            const [activeSection, setActiveSection] = useState('vocab');
            
            const sections = [
                { id: 'vocab', name: '字詞與解析', icon: 'fa-spell-check' },
                { id: 'phrases', name: '片語與慣用語', icon: 'fa-quote-right' },
                { id: 'grammar', name: '語法說明', icon: 'fa-book' },
                { id: 'reading', name: '課文解析', icon: 'fa-glasses' }
            ];

            return (
                <div className="flex flex-col md:flex-row gap-6">
                    {/* Sidebar */}
                    <div className="md:w-1/4">
                        <div className="bg-white rounded-xl shadow p-4 sticky top-24 space-y-2">
                            <h2 className="text-gray-500 text-sm font-bold uppercase tracking-wider mb-4 px-2">學習選單</h2>
                            {sections.map(sec => (
                                <button 
                                    key={sec.id}
                                    onClick={() => setActiveSection(sec.id)}
                                    className={`w-full text-left px-4 py-3 rounded-lg font-bold transition flex items-center ${activeSection === sec.id ? 'bg-red-500 text-white shadow-md' : 'text-gray-600 hover:bg-red-50 hover:text-red-500'}`}>
                                    <i className={`fa-solid ${sec.icon} w-6`}></i>
                                    {sec.name}
                                </button>
                            ))}
                        </div>
                    </div>
                    {/* Content */}
                    <div className="md:w-3/4">
                        <div className="mb-6 flex items-center">
                            <h1 className="text-3xl font-extrabold text-gray-800 border-l-8 border-yellow-400 pl-4">
                                {sections.find(s => s.id === activeSection).name}
                            </h1>
                        </div>
                        {activeSection === 'vocab' && <VocabView />}
                        {activeSection === 'phrases' && <PhrasesView />}
                        {activeSection === 'grammar' && <GrammarView />}
                        {activeSection === 'reading' && <ReadingView />}
                    </div>
                </div>
            );
        };

        // Quiz Interface
        const QuizInterface = ({ currentUser, isFirebaseReady }) => {
            const [qIndex, setQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [showExp, setShowExp] = useState(false);
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [isFinished, setIsFinished] = useState(false);
            const [wrongAnswers, setWrongAnswers] = useState([]);
            const [userAnswers, setUserAnswers] = useState(new Array(quizQuestions.length).fill(null));

            const currentQ = quizQuestions[qIndex];

            useEffect(() => {
                // 當測驗結束時，將紀錄存回 Firebase
                if (isFinished && currentUser && isFirebaseReady && window.fbHelpers) {
                    const saveRecord = async () => {
                        try {
                            const { doc, setDoc } = window.fbHelpers;
                            const recordId = `record_${Date.now()}`;
                            const recordRef = doc(db, COLLECTION_NAME, currentUser.uid, 'records', recordId);
                            await setDoc(recordRef, {
                                score,
                                total: quizQuestions.length,
                                answers: userAnswers,
                                timestamp: new Date().toISOString()
                            });
                        } catch (e) {
                            console.error("儲存測驗紀錄失敗:", e);
                        }
                    };
                    saveRecord();
                }
            }, [isFinished]);

            const handleAnswer = (optIndex) => {
                if (showExp) return; // Prevent multiple clicks
                setSelectedOpt(optIndex);
                setShowExp(true);
                
                // 記錄使用者的選擇
                const newAnswers = [...userAnswers];
                newAnswers[qIndex] = optIndex;
                setUserAnswers(newAnswers);

                if (optIndex === currentQ.ans) {
                    setScore(score + 1);
                } else {
                    setWrongAnswers([...wrongAnswers, { ...currentQ, userAns: currentQ.options[optIndex] }]);
                }
            };

            const nextQuestion = () => {
                if (qIndex < quizQuestions.length - 1) {
                    setQIndex(qIndex + 1);
                    setShowExp(false);
                    setSelectedOpt(null);
                } else {
                    setIsFinished(true);
                }
            };

            const restartQuiz = () => {
                setQIndex(0);
                setScore(0);
                setShowExp(false);
                setSelectedOpt(null);
                setIsFinished(false);
                setWrongAnswers([]);
                setUserAnswers(new Array(quizQuestions.length).fill(null));
            };

            if (isFinished) {
                const passRate = Math.round((score / quizQuestions.length) * 100);
                return (
                    <div className="max-w-6xl mx-auto bg-white rounded-xl shadow-xl p-8 text-center fade-in">
                        <h2 className="text-4xl font-extrabold text-gray-800 mb-4">測驗結束！</h2>
                        <div className="w-48 h-48 mx-auto rounded-full border-8 border-gray-100 flex items-center justify-center relative mb-6">
                            <svg className="absolute top-0 left-0 w-full h-full transform -rotate-90">
                                <circle cx="96" cy="96" r="88" stroke="currentColor" strokeWidth="16" fill="transparent" className="text-gray-200" />
                                <circle cx="96" cy="96" r="88" stroke="currentColor" strokeWidth="16" fill="transparent" 
                                    strokeDasharray={`${passRate * 5.5} 600`} 
                                    className={passRate >= 80 ? "text-green-500" : passRate >= 60 ? "text-yellow-500" : "text-red-500"} />
                            </svg>
                            <div className="text-center">
                                <span className="text-5xl font-bold">{score}</span>
                                <span className="text-xl text-gray-500"> / {quizQuestions.length}</span>
                            </div>
                        </div>
                        <p className="text-2xl font-bold mb-8 text-gray-700">
                            {passRate >= 80 ? "太棒了！你已經具備國三的進階實力！ 🎉" : passRate >= 60 ? "表現不錯，但進階文法還可以再加強！ 💪" : "需要對著名詞子句與被動語態再多複習一下喔！ 📚"}
                        </p>
                        
                        <button onClick={restartQuiz} className="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:-translate-y-1 mb-10">
                            <i className="fa-solid fa-rotate-right mr-2"></i> 再挑戰一次
                        </button>

                        {/* 全部作答總覽表：強制顯示所有 100 題的解析 */}
                        <div className="text-left mt-8">
                            <h3 className="text-2xl font-bold text-gray-800 border-b-2 border-gray-200 pb-2 mb-4">
                                <i className="fa-solid fa-list-check mr-2 text-blue-500"></i>作答總覽與解析表
                            </h3>
                            <div className="overflow-x-auto rounded-lg shadow border border-gray-200">
                                <table className="w-full text-left border-collapse min-w-[900px]">
                                    <thead>
                                        <tr className="bg-gray-100 border-b-2 border-gray-300">
                                            <th className="p-3 text-center w-16 text-gray-600">題號</th>
                                            <th className="p-3 text-gray-600 w-1/2">題目與選項</th>
                                            <th className="p-3 text-center w-40 text-gray-600">你的答案</th>
                                            <th className="p-3 text-center w-40 text-gray-600">正確答案</th>
                                            <th className="p-3 text-center w-20 text-gray-600">結果</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white">
                                        {quizQuestions.map((q, idx) => {
                                            const isCorrect = userAnswers[idx] === q.ans;
                                            const isSkipped = userAnswers[idx] === null;
                                            return (
                                                <tr key={idx} className="border-b border-gray-200 hover:bg-gray-50">
                                                    <td className="p-3 text-center font-bold text-gray-600 text-lg">{idx + 1}</td>
                                                    <td className="p-4">
                                                        <p className="font-bold text-gray-800 mb-3 text-lg leading-relaxed">{idx + 1}. {q.q}</p>
                                                        <div className="text-sm space-y-2 text-gray-600">
                                                            {q.options.map((opt, i) => (
                                                                <p key={i} className={`p-1 ${i === q.ans ? 'text-green-700 font-bold bg-green-100 rounded inline-block' : ''}`}>
                                                                    {String.fromCharCode(65 + i)}. {opt}
                                                                </p>
                                                            ))}
                                                        </div>
                                                        {/* 無論答對答錯，皆強制顯示完整解析說明，方便全面複習 */}
                                                        <div className="mt-4 text-sm bg-yellow-50 text-yellow-800 p-3 rounded-lg border border-yellow-200 shadow-sm leading-relaxed">
                                                            <i className="fa-solid fa-lightbulb text-yellow-500 mr-2"></i><strong>解析:</strong> {q.exp}
                                                        </div>
                                                    </td>
                                                    <td className={`p-3 text-center font-bold text-base ${isCorrect ? 'text-green-600' : 'text-red-500'}`}>
                                                        {isSkipped ? '-' : `${String.fromCharCode(65 + userAnswers[idx])}. ${q.options[userAnswers[idx]]}`}
                                                    </td>
                                                    <td className="p-3 text-center font-bold text-green-600 text-base">
                                                        {String.fromCharCode(65 + q.ans)}. {q.options[q.ans]}
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        {isCorrect 
                                                            ? <i className="fa-solid fa-check-circle text-green-500 text-3xl drop-shadow-sm"></i>
                                                            : <i className="fa-solid fa-times-circle text-red-500 text-3xl drop-shadow-sm"></i>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto fade-in">
                    <div className="flex justify-between items-center mb-4">
                        <span className="bg-yellow-400 text-yellow-900 font-bold px-3 py-1 rounded-full text-sm">Question {qIndex + 1} / {quizQuestions.length}</span>
                        <span className="font-bold text-gray-600">Score: <span className="text-red-500">{score}</span></span>
                    </div>
                    
                    {/* Progress Bar */}
                    <div className="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                        <div className="bg-red-500 h-2.5 rounded-full transition-all duration-300" style={{ width: `${((qIndex) / quizQuestions.length) * 100}%` }}></div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-lg p-6 md:p-10">
                        <h2 className="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">{qIndex + 1}. {currentQ.q}</h2>
                        
                        <div className="space-y-3 mb-8">
                            {currentQ.options.map((opt, idx) => {
                                let btnClass = "w-full text-left p-4 rounded-xl border-2 transition font-medium text-lg focus:outline-none ";
                                if (!showExp) {
                                    btnClass += "border-gray-200 hover:border-red-400 hover:bg-red-50 text-gray-700";
                                } else {
                                    if (idx === currentQ.ans) {
                                        btnClass += "border-green-500 bg-green-50 text-green-800"; // Correct answer
                                    } else if (idx === selectedOpt) {
                                        btnClass += "border-red-500 bg-red-50 text-red-800"; // Wrong selected
                                    } else {
                                        btnClass += "border-gray-200 text-gray-400 opacity-50"; // Unselected
                                    }
                                }

                                return (
                                    <button 
                                        key={idx} 
                                        onClick={() => handleAnswer(idx)}
                                        className={btnClass}
                                        disabled={showExp}
                                    >
                                        <span className="inline-block w-8 font-bold text-gray-400">{String.fromCharCode(65 + idx)}.</span>
                                        {opt}
                                        {showExp && idx === currentQ.ans && <i className="fa-solid fa-circle-check text-green-500 float-right mt-1 text-xl"></i>}
                                        {showExp && idx === selectedOpt && idx !== currentQ.ans && <i className="fa-solid fa-circle-xmark text-red-500 float-right mt-1 text-xl"></i>}
                                    </button>
                                );
                            })}
                        </div>

                        {showExp && (
                            <div className="fade-in bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-6">
                                <p className="text-yellow-800 font-bold mb-1"><i className="fa-solid fa-lightbulb mr-2"></i>解析</p>
                                <p className="text-gray-700 leading-relaxed">{currentQ.exp}</p>
                            </div>
                        )}

                        <div className="flex justify-end">
                            <button 
                                onClick={nextQuestion}
                                disabled={!showExp}
                                className={`font-bold py-3 px-8 rounded-full transition shadow ${showExp ? 'bg-red-500 hover:bg-red-600 text-white cursor-pointer' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                                {qIndex === quizQuestions.length - 1 ? '看成績' : '下一題'} <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // StatusBar Component
        const StatusBar = ({ isFirebaseReady, currentUser }) => (
            <div className="fixed bottom-4 right-4 flex flex-col items-end gap-2 z-50 fade-in pointer-events-none">
                {currentUser && (
                    <div className="bg-white/90 shadow rounded-full px-4 py-2 text-sm font-bold text-gray-700 border border-gray-200 backdrop-blur pointer-events-auto">
                        <i className="fa-solid fa-user text-red-500 mr-2"></i>{currentUser.name}
                    </div>
                )}
                {/* Firebase 連線狀態指示燈 */}
                <div id="firebase-status" className="flex items-center gap-3 px-4 py-2 bg-white/90 rounded-full shadow border border-gray-200 text-sm backdrop-blur pointer-events-auto">
                    <div id="status-dot" className={`status-dot ${isFirebaseReady ? 'dot-connected' : 'dot-connecting'}`}></div>
                    <span id="status-text" className="font-bold text-gray-600 tracking-wide">{isFirebaseReady ? '連線成功' : '系統連線中...'}</span>
                </div>
            </div>
        );

        // Login Component
        const LoginView = ({ onLogin, isFirebaseReady }) => {
            const [name, setName] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [recentUsers, setRecentUsers] = useState([]);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                if (!isFirebaseReady) return;
                const fetchUsers = async () => {
                    try {
                        const { doc, getDoc } = window.fbHelpers;
                        const docSnap = await getDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL));
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.users && Array.isArray(data.users)) {
                                // 取出所有名稱，並去重複。將最新的紀錄顯示在最前面
                                const names = data.users.map(u => typeof u === 'string' ? u : u.name).filter(Boolean);
                                const uniqueNames = [...new Set(names)].reverse();
                                setRecentUsers(uniqueNames);
                            }
                        }
                    } catch (e) {
                        console.error("無法取得近期登入名單:", e);
                    }
                };
                fetchUsers();
            }, [isFirebaseReady]);

            const handleLoginClick = async (loginName) => {
                setErrorMsg('');
                if (!isFirebaseReady) return setErrorMsg('系統連線中，請稍候...');
                if (!loginName.trim()) return setErrorMsg('請輸入您的姓名');
                
                setIsLoading(true);
                try {
                    await onLogin(loginName);
                } catch(err) {
                    setErrorMsg("登入失敗，請檢查網路連線後重試");
                }
                setIsLoading(false);
            };

            return (
                <div className="flex flex-col items-center justify-center py-20 fade-in">
                    <div className="bg-white p-10 rounded-3xl shadow-2xl border border-gray-100 w-full max-w-md text-center transform transition hover:-translate-y-1">
                        <div className="text-6xl text-red-500 mb-6 drop-shadow-md">
                            <i className="fa-solid fa-burger"></i>
                        </div>
                        <h2 className="text-3xl font-extrabold text-gray-800 mb-3 tracking-wide">L3 學習總部</h2>
                        <p className="text-gray-500 mb-8 font-medium">登入以自動儲存您的學習進度與測驗紀錄</p>
                        
                        {errorMsg && (
                            <div className="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 mb-6 rounded text-left text-sm font-bold shadow-sm">
                                <i className="fa-solid fa-circle-exclamation mr-2"></i>{errorMsg}
                            </div>
                        )}
                        
                        <input 
                            type="text" 
                            placeholder="請輸入姓名" 
                            className="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-red-400 focus:ring-4 focus:ring-red-100 focus:outline-none mb-6 text-lg font-bold text-center transition shadow-inner"
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleLoginClick(name)}
                        />
                        
                        <div className="space-y-4">
                            <button 
                                onClick={() => handleLoginClick(name)}
                                disabled={isLoading || !isFirebaseReady || !name.trim()}
                                className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition text-lg disabled:opacity-50 disabled:cursor-not-allowed">
                                {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : '輸入姓名登入'}
                            </button>
                            
                            <div className="relative flex items-center py-2">
                                <div className="flex-grow border-t border-gray-200"></div>
                                <span className="flex-shrink-0 mx-4 text-gray-400 text-sm font-bold">快速登入</span>
                                <div className="flex-grow border-t border-gray-200"></div>
                            </div>
                            
                            <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 max-h-48 overflow-y-auto">
                                {recentUsers.length > 0 ? (
                                    <div className="flex flex-wrap gap-2 justify-center">
                                        {recentUsers.map((uName, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleLoginClick(uName)}
                                                disabled={isLoading || !isFirebaseReady}
                                                className="bg-white border border-gray-200 hover:border-red-400 hover:text-red-500 text-gray-700 px-4 py-2 rounded-full font-bold shadow-sm transition text-sm disabled:opacity-50"
                                            >
                                                <i className="fa-solid fa-user mr-2 text-gray-400"></i>{uName}
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-sm text-gray-500 font-medium">尚無近期登入紀錄</p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('login'); // 'login', 'learning', 'quiz'
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initFirebase = () => {
                    // 等待模組掛載到全域變數後再初始化
                    if (!window.firebaseModules) {
                        setTimeout(initFirebase, 100);
                        return;
                    }
                    try {
                        const { initializeApp, getFirestore, doc, setDoc, getDoc, arrayUnion, getAuth, signInAnonymously, onAuthStateChanged } = window.firebaseModules;

                        // 初始化 Firebase
                        const app = initializeApp(firebaseConfig);
                        db = getFirestore(app);
                        auth = getAuth(app);
                        
                        // 掛載常用功能供其他元件使用
                        window.fbHelpers = { doc, setDoc, getDoc, arrayUnion }; 
                        setIsFirebaseReady(true);

                        // 登入狀態監聽
                        unsubscribeAuth = onAuthStateChanged(auth, async (user) => {
                            if (user) {
                                try {
                                    const docSnap = await getDoc(doc(db, COLLECTION_NAME, user.uid));
                                    if (docSnap.exists()) {
                                        setCurrentUser({ uid: user.uid, name: docSnap.data().name });
                                        setActiveTab('learning'); // 已經有紀錄的用戶直接進入學習介面
                                    }
                                } catch (err) {
                                    console.error("讀取使用者資料錯誤:", err);
                                }
                            }
                        });
                    } catch (e) {
                        console.error("Firebase 初始化失敗:", e);
                    }
                };
                initFirebase();
                return () => { if (unsubscribeAuth) unsubscribeAuth(); };
            }, []);

            const handleLogin = async (loginName) => {
                try {
                    const { signInAnonymously } = window.firebaseModules;
                    const { doc, setDoc, arrayUnion } = window.fbHelpers;
                    
                    const userCredential = await signInAnonymously(auth);
                    const user = userCredential.user;

                    const userData = {
                        uid: user.uid,
                        name: loginName,
                        lastLogin: new Date().toISOString()
                    };

                    // 1. 儲存至使用者專屬文件
                    await setDoc(doc(db, COLLECTION_NAME, user.uid), userData, { merge: true });
                    
                    // 2. 更新至 Global_Users 清單
                    await setDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL), {
                        users: arrayUnion({ uid: user.uid, name: loginName, time: new Date().toISOString() })
                    }, { merge: true });

                    setCurrentUser(userData);
                    setActiveTab('learning');
                } catch (e) {
                    console.error("登入邏輯失敗:", e);
                    throw e; // 拋出錯誤供 LoginView 捕捉
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative pb-16">
                    {activeTab !== 'login' && <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />}
                    
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-8 relative z-10">
                        {activeTab === 'login' && <LoginView onLogin={handleLogin} isFirebaseReady={isFirebaseReady} />}
                        {activeTab === 'learning' && <LearningInterface />}
                        {activeTab === 'quiz' && <QuizInterface currentUser={currentUser} isFirebaseReady={isFirebaseReady} />}
                    </main>

                    {/* 常駐的右下角連線狀態 */}
                    <StatusBar isFirebaseReady={isFirebaseReady} currentUser={currentUser} />

                    <footer className="bg-gray-800 text-gray-400 py-6 text-center mt-auto relative z-10">
                        <p>© 2026 Interactive English Learning - L3 Our Food Smells Good</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
